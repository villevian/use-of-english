.page{max-width:1000px;margin:0 auto}

/* HEADER */
.hero{
  background:rgba(255,255,255,0.94);
  border-radius:20px;padding:2.5rem 2rem 2rem;
  margin-bottom:2rem;box-shadow:var(--shadow);
  display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;
}
.hero-left .school{
  font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--blue-d),var(--blue));
  color:#fff;padding:.28rem .9rem;border-radius:50px;
  display:inline-block;margin-bottom:.9rem;
}
.hero-left h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(2rem,5vw,3.2rem);font-weight:900;line-height:1.05;
}
.hero-left h1 span{color:var(--accent);font-style:italic}
.hero-left p{font-style:italic;color:var(--mid);font-size:.95rem;margin-top:.4rem}
.hero-stat{
  text-align:right;font-family:'JetBrains Mono',monospace;
  font-size:.7rem;color:var(--light);
}
.hero-stat .num{
  font-family:'Playfair Display',serif;font-size:2.5rem;font-weight:900;
  color:var(--blue-d);display:block;line-height:1;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:.85rem;
}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}

/* UNIT CARD */
.unit-card{
  background:rgba(255,255,255,0.93);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:14px;padding:1.1rem;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:.5rem;
  position:relative;transition:all .2s;
  min-height:130px;
}
.unit-card.live{
  cursor:pointer;text-decoration:none;color:inherit;
  border-top:3px solid var(--blue);
}
.unit-card.live:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 32px rgba(30,77,107,0.18);
  background:rgba(255,255,255,0.98);
}
.unit-card.locked{
  opacity:.6;filter:grayscale(0.3);
  border-top:3px solid rgba(90,140,171,0.2);
}

.unit-num{
  font-family:'JetBrains Mono',monospace;
  font-size:.65rem;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--light);
}
.unit-title{
  font-family:'Playfair Display',serif;
  font-size:.95rem;font-weight:700;line-height:1.25;
  color:var(--ink);flex:1;
}
.unit-card.locked .unit-title{color:var(--mid)}

.unit-footer{display:flex;align-items:center;justify-content:space-between}
.open-btn{
  font-family:'JetBrains Mono',monospace;font-size:.63rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--blue-d),var(--blue));
  color:#fff;padding:.28rem .7rem;border-radius:50px;
  transition:opacity .15s;
}
.unit-card.live:hover .open-btn{opacity:.88}
.lock-icon{font-size:.95rem;opacity:.35}
.loading-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(90,140,171,0.4);
  animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* FOOTER */
footer{
  text-align:center;margin-top:2rem;padding:1rem;
  font-style:italic;font-size:.83rem;color:rgba(255,255,255,0.7);
  text-shadow:0 1px 4px rgba(0,0,0,.15);
}
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="hero-left">
      <div class="school">Speak Tomorrow Language School</div>
      <h1>Use of <span>English</span></h1>
      <p>Interactive grammar worksheets · B1–B2+</p>
    </div>
    <div class="hero-stat">
      <span class="num" id="live-count">—</span>
      units available
    </div>
  </div>

  <div class="grid" id="grid">
    <!-- filled by JS -->
  </div>

  <footer>Units become available as your teacher adds them. No page refresh needed.</footer>
</div>

<script>
const BASE = window.location.origin + window.location.pathname.replace('index.html','').replace(/\/$/, '');

const units = [
  {n:1, title:"Present Tenses", folder:"unit-1-present-tenses", file:"worksheet.html"},
  {n:2, title:"Past Tenses", folder:"unit-2-past-tenses", file:"worksheet.html"},
  {n:3, title:"Future Forms", folder:"unit-3-future-forms", file:"worksheet.html"},
  {n:4, title:"Modal Verbs", folder:"unit-4-modal-verbs", file:"worksheet.html"},
  {n:5, title:"Passive Voice", folder:"unit-5-passive-voice", file:"worksheet.html"},
  {n:6, title:"Reported Speech", folder:"unit-6-reported-speech", file:"worksheet.html"},
  {n:7, title:"Relative Clauses", folder:"unit-7-relative-clauses", file:"worksheet.html"},
  {n:8, title:"Conditionals & Wishes", folder:"unit-8-conditionals", file:"conditionals_worksheet.html"},
  {n:9, title:"Infinitives & Gerunds", folder:"unit-9-infinitives-gerunds", file:"worksheet.html"},
  {n:10, title:"Articles & Determiners", folder:"unit-10-articles", file:"worksheet.html"},
  {n:11, title:"Linking Words", folder:"unit-11-linking-words", file:"worksheet.html"},
  {n:12, title:"Word Formation", folder:"unit-12-word-formation", file:"worksheet.html"}
];

async function checkUnit(u) {
  const url = `${BASE}/${u.folder}/${u.file}`;
  try {
    const r = await fetch(url, {method:'HEAD', cache:'no-cache'});
    return r.ok ? url : null;
  } catch {
    return null;
  }
}

async function renderGrid() {
  const grid = document.getElementById('grid');

  // First pass: render loading state
  grid.innerHTML = units.map(u => `
    <div class="unit-card" id="card-${u.n}">
      <div class="unit-num">Unit ${u.n}</div>
      <div class="unit-title">${u.title}</div>
      <div class="unit-footer"><div class="loading-dot"></div></div>
    </div>
  `).join('');

  // Check all units in parallel
  const results = await Promise.all(units.map(checkUnit));
  let liveCount = 0;

  results.forEach((url, i) => {
    const u = units[i];
    const card = document.getElementById(`card-${u.n}`);
    if (url) {
      liveCount++;
      const a = document.createElement('a');
      a.href = url;
      a.className = 'unit-card live';
      a.id = `card-${u.n}`;
      a.innerHTML = `
        <div class="unit-num">Unit ${u.n}</div>
        <div class="unit-title">${u.title}</div>
        <div class="unit-footer">
          <span class="open-btn">Open →</span>
        </div>
      `;
      card.replaceWith(a);
    } else {
      card.className = 'unit-card locked';
      card.innerHTML = `
        <div class="unit-num">Unit ${u.n}</div>
        <div class="unit-title">${u.title}</div>
        <div class="unit-footer"><span class="lock-icon">🔒</span></div>
      `;
    }
  });

  document.getElementById('live-count').textContent = liveCount;
}

renderGrid();
</script>
</body>
</html>
